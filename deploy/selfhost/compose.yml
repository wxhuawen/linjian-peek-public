services:
  server:
    build:
      context: ../..
      dockerfile: deploy/selfhost/server.Dockerfile
    environment:
      LINJIAN_TOKEN: ${LINJIAN_TOKEN:?Set LINJIAN_TOKEN in deploy/selfhost/.env}
      LINJIAN_HOST: 0.0.0.0
      LINJIAN_PORT: 8513
      LINJIAN_DATA_DIR: /data
      LINJIAN_KEEP: 3
      LINJIAN_DEFAULT_DEVICE: android-phone
      LINJIAN_PUBLIC_URL: https://${LINJIAN_DOMAIN:?Set LINJIAN_DOMAIN in deploy/selfhost/.env}
    volumes:
      - linjian_data:/data
    ports:
      - "127.0.0.1:8513:8513"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8513/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  linjian_data:
