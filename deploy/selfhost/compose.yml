services:
  server:
    build:
      context: ../..
      dockerfile: deploy/selfhost/server.Dockerfile
    environment:
      LINJIAN_TOKEN: ${LINJIAN_TOKEN:?Set LINJIAN_TOKEN in deploy/selfhost/.env}
      LINJIAN_HOST: 0.0.0.0
      LINJIAN_PORT: 8513
      LINJIAN_DATA_DIR: /data
      LINJIAN_KEEP: 3
      LINJIAN_DEFAULT_DEVICE: android-phone
      LINJIAN_WEARABLE_STALE_AFTER_SECONDS: ${LINJIAN_WEARABLE_STALE_AFTER_SECONDS:-93600}
      LINJIAN_PUBLIC_URL: https://${LINJIAN_DOMAIN:?Set LINJIAN_DOMAIN in deploy/selfhost/.env}
    volumes:
      - linjian_data:/data
    ports:
      - "127.0.0.1:8513:8513"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8513/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp:
    build:
      context: ../..
      dockerfile: deploy/selfhost/mcp.Dockerfile
    environment:
      LINJIAN_TOKEN: ${LINJIAN_TOKEN:?Set LINJIAN_TOKEN in deploy/selfhost/.env}
      LINJIAN_URL: http://server:8513
      LINJIAN_DEFAULT_DEVICE: android-phone
      PORT: 8514
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8514:8514"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8514/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  linjian_data:
